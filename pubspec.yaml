name: hearable
description: "Hearable - High-Fidelity Apple Music Glassmorphic Streaming Player & Party Engine."
publish_to: 'none'

version: 2.0.0+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  just_audio: ^0.9.46
  audio_service: ^0.18.17
  just_audio_background: ^0.0.1-beta.12
  audio_session: ^0.1.25
  http: ^1.2.2
  provider: ^6.1.2
  palette_generator: ^0.3.3+4
  cached_network_image: ^3.4.1
  intl: ^0.19.0
  dart_des: ^1.0.2
  shared_preferences: ^2.3.3

dependency_overrides:
  path_provider_android: 2.2.15
  shared_preferences_android: 2.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
